<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Barrage — social card</title>
  <!-- Source for og.png (1200 x 630). Render: serve the repo, open og.html at a 1200 x 630
       viewport, screenshot. Background is a real frame of level 6 (dev.html?level=6&boom=1&hud=0).
       The logo copies the title screen's .logo treatment from src/ui/css/screens.css. -->
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #05060b; }
    body { position: relative; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; }
    .shot { position: absolute; left: 0; top: -12px; width: 1200px; height: 675px; object-fit: cover; }
    .scrim { position: absolute; inset: 0; background:
      radial-gradient(ellipse 62% 48% at 30% 18%, rgba(5, 6, 11, 0.62), rgba(5, 6, 11, 0) 100%),
      linear-gradient(180deg, rgba(5, 6, 11, 0.35) 0%, rgba(5, 6, 11, 0) 40%, rgba(5, 6, 11, 0) 78%, rgba(5, 6, 11, 0.7) 100%); }
    .brand { position: absolute; left: 56px; top: 34px; }
    .logo { position: relative; font-weight: 900; font-size: 150px; line-height: 1; letter-spacing: 0.08em; }
    .logo span { display: block; }
    .logo-text { position: relative;
      background: linear-gradient(180deg, #fffbe6 0%, #ffe14a 38%, #ff8a1e 68%, #e5301a 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      -webkit-text-stroke: 2px rgba(90, 20, 0, 0.55); }
    .logo-glow { position: absolute; inset: 0; color: #ff7a1a; filter: blur(22px); opacity: 0.8; }
    .logo-shine { position: absolute; inset: 0;
      background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, 0.5) 38%, transparent 46%);
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    .tagline { margin: 10px 0 0 6px; font-size: 23px; font-weight: 800; letter-spacing: 0.2em;
      text-transform: uppercase; color: rgba(255, 236, 200, 0.92); text-shadow: 0 2px 10px #000; }
    .play { position: absolute; left: 56px; bottom: 28px; margin: 0; padding: 12px 22px; border-radius: 999px;
      background: rgba(8, 10, 18, 0.72); border: 2px solid rgba(255, 210, 74, 0.75);
      color: #f4f6ff; font-size: 22px; font-weight: 800; letter-spacing: 0.02em; }
    .play b { color: #ffd24a; }
  </style>
</head>
<body>
  <img class="shot" src="docs/screenshot.jpg" alt="">
  <div class="scrim"></div>
  <div class="brand">
    <div class="logo">
      <span class="logo-glow">BARRAGE</span><span class="logo-text">BARRAGE</span><span class="logo-shine">BARRAGE</span>
    </div>
    <p class="tagline">Destructible-terrain artillery</p>
  </div>
  <p class="play">Play free in your browser at <b>barrage.cocode.dk</b></p>
</body>
</html>
